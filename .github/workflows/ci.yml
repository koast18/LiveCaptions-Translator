name: CI

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LiveCaptionsTranslator.sln

      - name: Build
        run: dotnet build LiveCaptionsTranslator.sln -c Release --no-restore

      - name: Test (Core)
        run: >
          dotnet test tests/LiveCaptionsTranslator.Core.Tests/LiveCaptionsTranslator.Core.Tests.csproj
          -c Release --logger "console;verbosity=normal"

      - name: Test (Platform.Windows)
        run: >
          dotnet test tests/LiveCaptionsTranslator.Platform.Tests/LiveCaptionsTranslator.Platform.Tests.csproj
          -c Release --logger "console;verbosity=normal"

      - name: Test (App)
        run: >
          dotnet test tests/LiveCaptionsTranslator.App.Tests/LiveCaptionsTranslator.App.Tests.csproj
          -c Release --logger "console;verbosity=normal"

      - name: Publish (win-x64, framework-dependent)
        run: >
          dotnet publish LiveCaptionsTranslator.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o ./publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator-win-x64
          path: ./publish/win-x64
          if-no-files-found: error

  # Talks to the real iFlytek endpoint with a committed speech sample. This is the only job that
  # proves the hand-rolled protocol works end to end, so it is kept separate from the unit tests:
  # it needs the network and it is the job that fails first if the endpoint is unreachable from
  # GitHub's runners or the committed credentials have been rotated.
  integration:
    name: Integration (real iFlytek endpoint)
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Integration tests
        run: >
          dotnet test tests/LiveCaptionsTranslator.Integration.Tests/LiveCaptionsTranslator.Integration.Tests.csproj
          -c Release --logger "console;verbosity=detailed"

  # Runs the real application in both Windows themes on an ephemeral runner and checks that the
  # theme it applies (and the brushes it resolves) actually follow the setting. This is the only
  # automated coverage for light/dark mode: it needs a desktop session and it changes the registry,
  # which is fine on a throwaway runner but not on a developer machine.
  ui-theme:
    name: UI theme (light + dark)
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish LiveCaptionsTranslator.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o ./publish/ui

      - name: Probe both themes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          $exe = Join-Path $PWD 'publish/ui/LiveCaptionsTranslator.exe'
          $work = Join-Path $PWD 'publish/ui'

          function Probe([int] $light) {
            Set-ItemProperty $key -Name AppsUseLightTheme -Value $light
            Set-ItemProperty $key -Name SystemUsesLightTheme -Value $light
            Start-Sleep -Seconds 1

            $out = Join-Path $PWD "theme-$light.txt"
            Remove-Item $out -ErrorAction SilentlyContinue
            $env:LCT_THEME_PROBE = $out

            $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
            Start-Sleep -Seconds 10
            if (-not $p.HasExited) { $p.Kill() }

            if (-not (Test-Path $out)) { throw "the app never wrote $out (did it start?)" }
            Write-Output "--- AppsUseLightTheme=$light ---"
            Get-Content $out | ForEach-Object { Write-Output $_ }
            return (Get-Content $out)
          }

          $dark = Probe 0
          $light = Probe 1

          function Value($lines, $name) {
            ($lines | Select-String "^$name=" | Select-Object -First 1).Line
          }

          $darkBg = Value $dark 'ApplicationBackgroundBrush'
          $lightBg = Value $light 'ApplicationBackgroundBrush'
          $darkText = Value $dark 'TextFillColorPrimaryBrush'
          $lightText = Value $light 'TextFillColorPrimaryBrush'

          if ((Value $dark 'AppsUseLightTheme') -ne 'AppsUseLightTheme=0') { throw "dark run read the wrong registry value: $(Value $dark 'AppsUseLightTheme')" }
          if ((Value $light 'AppsUseLightTheme') -ne 'AppsUseLightTheme=1') { throw "light run read the wrong registry value: $(Value $light 'AppsUseLightTheme')" }
          if (-not $darkBg) { throw 'the app could not resolve ApplicationBackgroundBrush' }
          if ($darkBg -eq $lightBg) { throw "the background brush did not change between themes: $darkBg" }
          if ($darkText -eq $lightText) { throw "the text brush did not change between themes: $darkText" }

          Write-Output "OK dark:  $darkBg  $darkText"
          Write-Output "OK light: $lightBg  $lightText"
