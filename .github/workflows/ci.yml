name: CI

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

# Pushing twice in a row would otherwise queue a second full run behind the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restores a previous cache even when a project file changed, so adding a package does not
      # cost a full 30 s of downloads. NuGet tolerates a stale cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # windows-latest already ships a .NET 8 SDK. setup-dotnet downloaded a second one (285 MB)
      # on every job, which was the single largest cost of the build.

      - name: Restore
        run: dotnet restore LiveCaptionsTranslator.sln

      - name: Build
        run: dotnet build LiveCaptionsTranslator.sln -c Release --no-restore

      - name: Test (Core)
        run: >
          dotnet test tests/LiveCaptionsTranslator.Core.Tests/LiveCaptionsTranslator.Core.Tests.csproj
          -c Release --logger "console;verbosity=normal"

      - name: Test (Platform.Windows)
        run: >
          dotnet test tests/LiveCaptionsTranslator.Platform.Tests/LiveCaptionsTranslator.Platform.Tests.csproj
          -c Release --logger "console;verbosity=normal"

      - name: Test (App)
        run: >
          dotnet test tests/LiveCaptionsTranslator.App.Tests/LiveCaptionsTranslator.App.Tests.csproj
          -c Release --logger "console;verbosity=normal"

      - name: Publish (win-x64, framework-dependent)
        run: >
          dotnet publish LiveCaptionsTranslator.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o ./publish/win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveCaptionsTranslator-win-x64
          path: ./publish/win-x64
          if-no-files-found: error

  # Talks to the live endpoint with a committed speech sample. This is the only job that
  # proves the hand-rolled protocol works end to end, so it is kept separate from the unit tests:
  # it needs the network and it is the job that fails first if the endpoint is unreachable from
  # GitHub's runners or the committed credentials have been rotated.
  integration:
    name: Integration (live endpoint)
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restores a previous cache even when a project file changed, so adding a package does not
      # cost a full 30 s of downloads. NuGet tolerates a stale cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # windows-latest already ships a .NET 8 SDK. setup-dotnet downloaded a second one (285 MB)
      # on every job, which was the single largest cost of the build.

      # Blocking: proves the hand-rolled protocol against a service we can rely on.
      - name: Integration tests (blocking)
        run: >
          dotnet test tests/LiveCaptionsTranslator.Integration.Tests/LiveCaptionsTranslator.Integration.Tests.csproj
          -c Release --filter "Category!=the secondary provider" --logger "console;verbosity=detailed"

      # Advisory: the second endpoint answers 50700000 ("service discovery failure") for whole
      # stretches of time from cloud IPs, which is their outage, not a regression here. It still
      # runs and reports, it just cannot block a build.
      - name: Integration tests (the secondary provider, advisory)
        continue-on-error: true
        run: >
          dotnet test tests/LiveCaptionsTranslator.Integration.Tests/LiveCaptionsTranslator.Integration.Tests.csproj
          -c Release --filter "Category=the secondary provider" --logger "console;verbosity=detailed"

  # Runs the real application in both Windows themes on an ephemeral runner, checks the brushes it
  # resolved, and measures the pixels it actually drew. This is the only automated coverage for
  # light/dark mode: it needs a desktop session and it writes the registry, which is fine on a
  # throwaway runner but never on a developer machine.
  ui-theme:
    name: UI theme (light + dark)
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Restores a previous cache even when a project file changed, so adding a package does not
      # cost a full 30 s of downloads. NuGet tolerates a stale cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # windows-latest already ships a .NET 8 SDK. setup-dotnet downloaded a second one (285 MB)
      # on every job, which was the single largest cost of the build.

      - name: Publish
        run: >
          dotnet publish LiveCaptionsTranslator.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o ./publish/ui

      - name: Verify both themes render correctly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class FindWin {
              public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc callback, IntPtr lParam);
              [DllImport("user32.dll")] public static extern int GetWindowThreadProcessId(IntPtr hWnd, out int pid);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
          }
          public class Shot {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr hdc, uint f);
          }
          "@

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          $exe = Join-Path $PWD 'publish/ui/LiveCaptionsTranslator.exe'
          $work = Join-Path $PWD 'publish/ui'

          function Run([int] $light) {
            Set-ItemProperty $key -Name AppsUseLightTheme -Value $light
            Set-ItemProperty $key -Name SystemUsesLightTheme -Value $light
            Start-Sleep -Seconds 1

            $probe = Join-Path $PWD "theme-$light.txt"
            Remove-Item $probe -ErrorAction SilentlyContinue
            $env:LCT_THEME_PROBE = $probe

            $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru

            # The probe is written once the dispatcher goes idle, which a cold runner can push
            # well past a fixed sleep. Wait for the file instead of guessing.
            for ($wait = 0; $wait -lt 60; $wait++) {
              if (Test-Path $probe) { break }
              if ($p.HasExited) { throw "the app exited before writing its probe (code $($p.ExitCode))" }
              Start-Sleep -Milliseconds 500
            }

            # MainWindowHandle is not reliable for a WPF window with custom chrome, so poll for it
            # instead of reading it once, and fall back to enumerating this process's windows.
            $h = [IntPtr]::Zero
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $p.Refresh()
              if ($p.HasExited) { throw "the app exited early with code $($p.ExitCode)" }
              if ($p.MainWindowHandle -ne [IntPtr]::Zero) { $h = $p.MainWindowHandle; break }
              Start-Sleep -Milliseconds 500
            }

            if ($h -eq [IntPtr]::Zero) {
              $target = $p.Id
              [void][FindWin]::EnumWindows({
                param($wh, $lp)
                $owner = 0
                [void][FindWin]::GetWindowThreadProcessId($wh, [ref]$owner)
                if ($owner -eq $target -and [FindWin]::IsWindowVisible($wh)) {
                  $script:h = $wh
                  return $false
                }
                return $true
              }, [IntPtr]::Zero)
            }

            if ($h -eq [IntPtr]::Zero) { throw 'the app never created a visible window' }

            $r = New-Object Shot+RECT
            [Shot]::GetWindowRect($h, [ref]$r) | Out-Null
            $w = $r.Right - $r.Left
            $hh = $r.Bottom - $r.Top
            $bmp = New-Object System.Drawing.Bitmap $w, $hh
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $hdc = $g.GetHdc()
            [Shot]::PrintWindow($h, $hdc, 2) | Out-Null
            $g.ReleaseHdc($hdc)
            $g.Dispose()
            $bmp.Save((Join-Path $PWD "render-$light.png"), [System.Drawing.Imaging.ImageFormat]::Png)

            # Sample a grid rather than every pixel: GetPixel is slow.
            $sum = 0.0
            $n = 0
            for ($y = 2; $y -lt $hh; $y += 4) {
              for ($x = 2; $x -lt $w; $x += 4) {
                $c = $bmp.GetPixel($x, $y)
                $sum += 0.2126 * $c.R + 0.7152 * $c.G + 0.0722 * $c.B
                $n++
              }
            }
            $bmp.Dispose()

            if (-not $p.HasExited) { $p.Kill() }

            $lines = Get-Content $probe
            [pscustomobject]@{
              Theme   = ($lines | Select-String '^AppsUseLightTheme=' | Select-Object -First 1).Line
              Bg      = ($lines | Select-String '^ApplicationBackgroundBrush=' | Select-Object -First 1).Line
              Text    = ($lines | Select-String '^TextFillColorPrimaryBrush=' | Select-Object -First 1).Line
              Luma    = [math]::Round($sum / $n, 1)
              Size    = "${w}x${hh}"
            }
          }

          $dark = Run 0
          $light = Run 1

          Write-Output "dark : $($dark.Theme) | $($dark.Bg) | $($dark.Text) | luma=$($dark.Luma) | $($dark.Size)"
          Write-Output "light: $($light.Theme) | $($light.Bg) | $($light.Text) | luma=$($light.Luma) | $($light.Size)"

          if ($dark.Theme -ne 'AppsUseLightTheme=0') { throw "dark run read the wrong registry value: $($dark.Theme)" }
          if ($light.Theme -ne 'AppsUseLightTheme=1') { throw "light run read the wrong registry value: $($light.Theme)" }
          if ($dark.Bg -eq $light.Bg) { throw "background brush did not change: $($dark.Bg)" }
          if ($dark.Text -eq $light.Text) { throw "text brush did not change: $($dark.Text)" }

          # The rendered pixels are the point: a correct dictionary on a transparent window still
          # looks wrong, which is exactly the Windows 10 bug this job exists to catch.
          if ($dark.Luma -ge 100) { throw "dark theme rendered bright (mean luma $($dark.Luma))" }
          if ($light.Luma -le 120) { throw "light theme rendered dark (mean luma $($light.Luma))" }

          Write-Output "OK: dark renders at luma $($dark.Luma), light at $($light.Luma)"

  # Opens the settings page on a throwaway runner, proves nothing sticks out past the window,
  # and keeps the screenshot as an artifact. The page used to render about 2000 px wide inside a
  # 750 px window, which no unit test could see.
  settings-layout:
    name: Settings layout
    runs-on: windows-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish
        run: >
          dotnet publish LiveCaptionsTranslator.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o ./publish/settings

      - name: The settings page must fit the window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class Ui {
              [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint dx, uint dy, uint d, IntPtr e);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr h, IntPtr dc, uint f);
              [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }
          }
          "@

          $exe = Join-Path $PWD 'publish/settings/LiveCaptionsTranslator.exe'
          $work = Join-Path $PWD 'publish/settings'
          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "the app exited with code $($p.ExitCode)" }

          $root = [System.Windows.Automation.AutomationElement]::RootElement
          $cond = New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::ProcessIdProperty, $p.Id)
          $win = $null
          for ($i = 0; $i -lt 20 -and -not $win; $i++) {
            $win = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, $cond)
            if (-not $win) { Start-Sleep -Milliseconds 500 }
          }
          if (-not $win) { throw 'the app never created a window' }

          $handle = [IntPtr]$win.Current.NativeWindowHandle
          [void][Ui]::SetForegroundWindow($handle)

          # The navigation entry is a DataItem named after the page it opens.
          $item = $win.FindFirst([System.Windows.Automation.TreeScope]::Descendants,
            (New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'Setting')))
          if (-not $item) { throw 'the settings navigation entry was not found' }

          $r = $item.Current.BoundingRectangle
          for ($click = 0; $click -lt 2; $click++) {
            [void][Ui]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2))
            Start-Sleep -Milliseconds 300
            [Ui]::mouse_event(0x0002, 0, 0, 0, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 80
            [Ui]::mouse_event(0x0004, 0, 0, 0, [IntPtr]::Zero)
            Start-Sleep -Milliseconds 1200
          }

          $bounds = New-Object Ui+RECT
          [void][Ui]::GetWindowRect($handle, [ref]$bounds)
          $width = $bounds.Right - $bounds.Left
          $height = $bounds.Bottom - $bounds.Top

          $elements = $win.FindAll([System.Windows.Automation.TreeScope]::Descendants,
            [System.Windows.Automation.Condition]::TrueCondition)
          $overflow = @()
          foreach ($e in $elements) {
            $rect = $e.Current.BoundingRectangle
            if ($rect.Width -le 0 -or $rect.Height -le 0) { continue }
            $right = $rect.X + $rect.Width
            if ($right -gt ($bounds.Right + 1)) {
              $overflow += ("{0} '{1}' ends at {2}, window ends at {3}" -f
                $e.Current.ControlType.ProgrammaticName.Replace('ControlType.',''), $e.Current.Name, [int]$right, $bounds.Right)
            }
          }

          $bmp = New-Object System.Drawing.Bitmap $width, $height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $dc = $g.GetHdc()
          [void][Ui]::PrintWindow($handle, $dc, 2)
          $g.ReleaseHdc($dc)
          $g.Dispose()
          $bmp.Save((Join-Path $PWD 'settings.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp.Dispose()
          if (-not $p.HasExited) { $p.Kill() }

          Write-Output "window ${width}x${height}, $($elements.Count) elements"
          if ($overflow.Count -gt 0) {
            $overflow | Select-Object -First 10 | ForEach-Object { Write-Output "  $_" }
            throw "$($overflow.Count) elements extend past the window"
          }
          Write-Output 'OK: every element is inside the window'

      - name: Upload the settings screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-screenshot
          path: settings.png
          if-no-files-found: warn
